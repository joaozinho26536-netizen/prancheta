<a class="skip" href="#main">Pular para o conteúdo</a>
<div class="layout">
  <aside class="sidebar">
    <a class="brand" href="#dashboard"><span class="logo" aria-hidden="true">P</span>Prancheta</a>
    <nav class="nav" id="nav" aria-label="Seções"></nav>
    <a class="nav-settings" href="#configuracoes" data-r="configuracoes"><svg class="ic" aria-hidden="true"><use href="#i-gear"/></svg><span>Configurações</span></a>
  </aside>
  <div class="content">
    <header class="topbar">
      <div class="search" role="search">
        <svg class="ic" aria-hidden="true"><use href="#i-search"/></svg>
        <input id="search" type="search" placeholder="Buscar projetos, tarefas, clientes, notas…  ( / )" aria-label="Busca global" autocomplete="off">
        <ul id="search-results" class="search-results" hidden></ul>
      </div>
      <span class="today" id="today"></span>
      <div class="timer-chip" id="timer-chip" aria-live="off"></div>
      <button class="icon-btn music-btn" id="music-btn" aria-expanded="false" aria-controls="music" aria-label="Música" title="Música"><svg class="ic" aria-hidden="true"><use href="#i-music"/></svg></button>
      <div class="new-wrap">
        <button class="btn primary" id="new-btn" aria-haspopup="menu" aria-expanded="false"><svg class="ic" aria-hidden="true"><use href="#i-plus"/></svg> Novo</button>
        <div class="menu" id="new-menu" role="menu" hidden></div>
      </div>
      <a class="icon-btn" href="#configuracoes" aria-label="Configurações" title="Configurações"><svg class="ic" aria-hidden="true"><use href="#i-gear"/></svg></a>
    </header>
    <div class="demo-banner" id="demo-banner" hidden></div>
    <main id="main" tabindex="-1"><p class="muted">Carregando…</p></main>
  </div>
</div>
<aside class="music" id="music" aria-label="Música" hidden>
  <header><h2>Música</h2><button class="btn small ghost" data-music-stop>Parar e fechar o player</button><button class="icon-btn" data-music-close aria-label="Esconder (a música continua)"><svg class="ic" aria-hidden="true"><use href="#i-x"/></svg></button></header>
  <div class="music-player"></div>
  <form class="music-form" novalidate>
    <input name="link" id="music-link" placeholder="Link do Spotify" aria-label="Link do Spotify" autocomplete="off">
    <input name="name" placeholder="Nome para os favoritos (opcional)" aria-label="Nome para os favoritos">
    <small class="err" role="alert"></small>
    <div class="row"><button class="btn primary small" value="play">Tocar</button><button class="btn small" value="save">Tocar e salvar nos favoritos</button></div>
  </form>
  <ul class="music-saved rows"></ul>
  <p class="small muted">Com o Spotify conectado neste navegador, as músicas tocam inteiras; sem login, só trechos de 30 s.</p>
</aside>
<div class="toasts" id="toasts" aria-live="polite"></div>
<noscript><p style="padding:24px">A Prancheta precisa de JavaScript ativado.</p></noscript>

<script src="js/model.js"></script>
<script src="js/db.js"></script>
<script src="js/ui.js"></script>
<script src="js/app.js"></script>
<script src="js/views-work.js"></script>
<script src="js/views-time.js"></script>
<script src="js/views-more.js"></script>
</body>
</html>
